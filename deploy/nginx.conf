# Orkestr va Xor — Nginx konfiguratsiyasi
#
# Joyi:  /etc/nginx/sites-available/orkestrvaxor
# Ulash: sudo ln -s /etc/nginx/sites-available/orkestrvaxor /etc/nginx/sites-enabled/
#
# SSL (443-port) bloklarini certbot o'zi qo'shadi:
#   sudo certbot --nginx -d orkestrvaxor.uz -d www.orkestrvaxor.uz

server {
    listen 80;
    listen [::]:80;
    server_name orkestrvaxor.uz www.orkestrvaxor.uz;

    # Admin paneldan rasm yuklash 8 MB gacha ruxsat etilgan.
    # Nginx'ning standart chegarasi 1 MB — oshirilmasa yuklash "413" xatosi beradi.
    client_max_body_size 10M;

    # Matnli javoblarni siqish (rasm va videoni siqish shart emas)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Formalardagi spam chegarasi (IP bo'yicha) shu sarlavhalarni o'qiydi —
        # ularsiz barcha so'rovlar bitta IP dan kelayotgandek ko'rinadi.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js o'zgarmas fayllari — brauzerda uzoq saqlanadi
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Admin paneldan yuklangan rasmlar — Nginx to'g'ridan-to'g'ri beradi
    location /uploads/ {
        alias /var/www/orkestrvaxor/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
